# 식품 카테고리 정의: 카테고리 = HS 6단위 코드 묶음.
# 새 카테고리를 돌리려면 여기에 블록 하나만 추가하고 --category 로 지정하면 된다.
# HS 코드 원문: WCO Harmonized System (UN Comtrade 동일 코드 체계)

dry_confectionery:
  name_ko: 건식 과자류 (빙과 제외)
  note: >
    롯데웰푸드 주력 건과 포트폴리오(빼빼로·초코파이·가나·자일리톨·캔디)에 대응.
    아이스크림(HS 2105)은 제외. 1806.10/20(코코아분말·벌크 원료)은 B2B 원료라 제외.
  hs_codes:
    "170410": 추잉껌
    "170490": 기타 설탕과자 (캔디, 젤리 등)
    "180631": 초콜릿 (속 채운 판/막대)
    "180632": 초콜릿 (속 없는 판/막대)
    "180690": 기타 초콜릿 과자 (초코볼, 코팅 제품 등)
    "190531": 스위트 비스킷 (쿠키, 초코파이류 포함)
    "190532": 와플·웨이퍼
    "190590": 기타 베이커리 (크래커, 스낵류 포함)

ice_cream:
  name_ko: 빙과 (아이스크림)
  note: 롯데웰푸드 빙과(월드콘·설레임·돼지바 등). HS 2105는 아이스크림·기타 빙과류 전체.
  hs_codes:
    "210500": 아이스크림 및 기타 빙과류

edible_fats:
  name_ko: 유지 (마가린·쇼트닝)
  note: >
    롯데웰푸드 B2B 유지(제과·제빵용 마가린, 쇼트닝, 튀김유). 원유(대두유 등 1507~1515)는
    원료 상품이라 제외하고, 가공 유지(1516.20, 1517)만 포함.
  hs_codes:
    "151620": 식물성 경화 유지
    "151710": 마가린
    "151790": 기타 식용 조제 유지 (쇼트닝 등)

hmr:
  name_ko: 가정간편식 (HMR)
  note: >
    롯데웰푸드 HMR(쉐푸드 만두·냉동식품 등). 한국 HMR 수출 통계에서 주로 쓰는 코드만 포함.
    라면(1902.30)은 롯데웰푸드 주력이 아니라 제외.
  hs_codes:
    "190220": 속을 채운 파스타 (만두 포함)
    "190490": 기타 조제 곡물 (즉석밥 등)
    "210410": 수프·브로스 (국·탕류)

processed_meat:
  name_ko: 육가공 (햄·소시지)
  note: 롯데웰푸드 육가공(의성마늘햄, 롯데햄 등). 돼지고기 조제품 중심.
  hs_codes:
    "160100": 소시지
    "160241": 햄 (돼지 넓적다리)
    "160242": 돼지 어깨살 조제품
    "160249": 기타 돼지고기 조제품 (런천미트 등)

# 새 카테고리 = 블록 하나 추가. 이미 받은 HS 코드는 재수집하지 않는다(data/store 공유).
# 예시:
# ramen:
#   name_ko: 라면
#   hs_codes:
#     "190230": 기타 파스타 (라면 포함)
