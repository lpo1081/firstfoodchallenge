# 에이전트가 생성한 기준(adopt). 원본 기준은 그대로 둔다.
id: k_export_agent
name_ko: K-푸드 수출 유망도 (3개 기준 통합, 카테고리 공통) · 에이전트 갱신
universe:
  min_population: 1000000
  exclude_iso3:
  - KOR
  min_indicator_coverage: 8
  min_korea_exports_usd: 100000
benchmarks:
  momentum: korea_exports_cagr
  size_only: korea_exports_size
min_window_n: 15
target:
  series: KOR_X
  horizon: 3
  kind: abs
indicators:
- id: import_market_size
  group: 성장성
  name_ko: 수입시장 규모
  source: comtrade
  flow: M
  transform: level_log
  window: 3
  direction: 1
  weight: 0.1
  unit: ln(USD)
- id: hh_consumption_pc_cagr
  group: 성장성
  name_ko: 1인당 실질 가계소비 성장률
  source: worldbank
  series: NE.CON.PRVT.PC.KD
  transform: cagr
  window: 5
  smooth: 3
  direction: 1
  weight: 0.1
  unit: '%/년'
- id: population_size
  group: 성장성
  name_ko: 인구 규모
  source: worldbank
  series: SP.POP.TOTL
  transform: level_log
  window: 1
  direction: 1
  weight: 0.1
  unit: ln(명)
- id: youth_share
  group: 소비트렌드
  name_ko: 유소년(0-14세) 비중
  source: worldbank
  series: SP.POP.0014.TO.ZS
  transform: level
  window: 1
  direction: 1
  weight: 0.1
  unit: '%'
- id: urbanization_change
  group: 소비트렌드
  name_ko: 도시화 진행 속도
  source: worldbank
  series: SP.URB.TOTL.IN.ZS
  transform: diff
  window: 5
  direction: 1
  weight: 0.1
  unit: '%p/5년'
- id: gdp_pc_ppp
  group: 소비트렌드
  name_ko: 1인당 GDP(PPP)
  source: worldbank
  series: NY.GDP.PCAP.PP.KD
  transform: level_log
  window: 1
  direction: 1
  weight: 0.1
  unit: ln(USD)
- id: import_pc_cagr
  group: 소비트렌드
  name_ko: 1인당 수입 증가율
  source: comtrade
  flow: M
  transform: per_capita_cagr
  window: 5
  smooth: 3
  direction: 1
  weight: 0.1
  unit: '%/년'
- id: korea_exports_size
  group: 수출입
  name_ko: 한국 수출 규모
  source: comtrade
  flow: KOR_X
  transform: level_log
  window: 3
  direction: 1
  weight: 0.1
  unit: ln(USD)
- id: korea_exports_cagr
  group: 수출입
  name_ko: 한국 수출 성장률
  source: comtrade
  flow: KOR_X
  transform: cagr
  window: 5
  smooth: 3
  direction: 1
  weight: 0.1
  unit: '%/년'
- id: korea_share_change
  group: 수출입
  name_ko: 한국산 비중 변화
  source: comtrade
  flow: KOR_X
  transform: share_diff
  window: 5
  direction: 1
  weight: 0.1
  unit: '%p/5년'
- id: kpop_interest
  name_ko: K-pop 검색 관심도
  group: 소비트렌드
  source: external
  series: gtrends_kpop
  transform: level
  window: 3
  direction: 1
  unit: 0-100
  weight: 0.0
- id: kfood_interest
  name_ko: 한국 음식 검색 관심도
  group: 소비트렌드
  source: external
  series: gtrends_kfood
  transform: level
  window: 3
  direction: 1
  unit: 0-100
  weight: 0.0
- id: korea_visitors_pc
  name_ko: 인구 대비 방한 관광객
  group: 소비트렌드
  source: external
  series: kto_visitors
  transform: per_capita
  window: 3
  direction: 1
  unit: 명/인
  weight: 0.0
- id: learn_korean_interest
  name_ko: 한국어 학습 검색 관심도
  group: 소비트렌드
  source: external
  series: gtrends_learnkorean
  transform: level
  window: 3
  direction: 1
  unit: 0-100
  weight: 0.0
