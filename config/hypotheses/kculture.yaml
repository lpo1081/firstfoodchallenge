id: kculture
proposed_by: human (형님)
statement: >-
  신흥국의 소득 성장과 별개로, 한류(K-문화) 확산이 큰 나라일수록 이후 3년간 한국 과자 수출이 더 늘었다.
rationale: >-
  2차 모델에서 소비트렌드 비중이 15% → 43%로 올랐지만 지표가 인구·소득 대리지표뿐이었다.
  K-문화 노출을 직접 재는 지표를 넣어, 소득을 통제해도 설명력이 남는지 본다.
