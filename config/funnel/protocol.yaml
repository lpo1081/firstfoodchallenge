# 통합 진출국 선정 깔때기(funnel): 대기업이 진출국을 고를 때 거치는 표준 단계를 한 번에 돌린다.
# 이 파일은 결과를 계산하기 전에 커밋해 고정한다(2026-11-03). 결과를 본 뒤 바꾸면 report 에 사유를 남긴다.
#
# 왜 이 단계인가 (출처는 config/funnel/checklist.yaml):
#   - 국제 마케팅 교과서의 3단계 진출국 선정(Cavusgil 계열): 1차 거르기(거시 위험·거리) → 정밀 심사(시장 매력도, 가중 점수)
#     → 최종 선정(비용·매출·현금흐름 예측 = 실사). https://wsu.pressbooks.pub/cpim/chapter/6-5-selecting-the-countries-to-enter/
#   - 컨설팅의 '시장 매력도 × 승산(ability to win)' 2축, Ghemawat CAGE 거리(문화·제도·지리·경제).
#   - ITC 수출잠재력 지표(EPI) = 공급 × 무역 용이성 × 수요(수입 전망·관세 우위·거리).
#   - 롯데웰푸드 실제 움직임: 빼빼로 2035년 1조, 인도 현지 생산, 싱가포르 합작법인(One Lotte) → 수출 공략국과 현지생산국을 구분.
# 기존 모델(three, rolling, alt, entry_cost)과 결과는 바꾸지 않는다. 같은 원천 데이터(data/store)를 읽기만 한다.

id: funnel_v1
frozen: 2026-11-03
as_of: 2024                 # 2024년 데이터까지(3년 평균은 2022~2024)

# 품목: 빼빼로가 속한 비스킷류(HS 1905). 다른 품목은 --category 로 config/categories.yaml 의 블록을 쓴다.
category:
  id: biscuits
  name_ko: 비스킷류(빼빼로·초코파이·쿠키·웨이퍼)
  hs_codes: ["190531", "190532", "190590"]

# ------------------------------------------------------------------ 0단계: 대상
universe:
  min_population: 1000000
  exclude_iso3: [KOR]
  need_import_data: true     # 해당 품목 수입 통계가 있는 나라만

# ------------------------------------------------------------------ 1단계: 기본 자격 심사(탈락 규칙, 하나라도 걸리면 탈락)
# 대기업 1차 거르기의 표준 항목: 거시 위험(제재·전쟁·정치), 최소 시장 규모, 소득 수준, 그리고 회사 포트폴리오 결정.
stage1:
  rules:
    - {id: sanctions_war, name_ko: 제재·전쟁, kind: hard_filter, file: config/filters/hard_filter.yaml, rule_ids: [sanctions, armed_conflict]}
    - {id: political, name_ko: 정치 불안, kind: below, indicator: political_stability, threshold: -1.0,
       why: "세계은행 정치안정 지수 3년 평균 -1.0 미만(하위 약 16%). 기존 hard_filter 의 '경고선'을 기업 기준으로 탈락선으로 씀"}
    - {id: market_size, name_ko: 최소 시장 규모, kind: below, indicator: import_usd, threshold: 20000000,
       why: "품목 수입시장 3년 평균 2,000만 달러 미만이면 1%p 점유율이 연 20만 달러(약 3억원)로 진출 고정비(등록·라벨·판촉)를 못 넘김"}
    - {id: income, name_ko: 소득 하한, kind: below, indicator: gdp_pc_ppp, threshold: 5000,
       why: "1인당 소득(PPP) 5,000달러 미만이면 수입 과자 가격대(현지 과자의 2~3배)를 감당할 소비층이 얇음"}
    - {id: lotte_existing, name_ko: 롯데 기진출국(현지 사업 트랙), kind: entries, file: config/entries/lotte_wellfood.yaml}
    - {id: defend, name_ko: 이미 큰 한국 수출시장(지키는 시장), kind: top_korea_exports, n: 5,
       why: "한국산 해당 품목 수출 상위 5개국은 '새로 들어갈 곳'이 아니라 키울 곳"}

# ------------------------------------------------------------------ 2단계: 시장 매력도(어디서 싸울까)
# 점수 = 지표별 백분위(1단계 통과국 안에서) × 비중. 통과 = 상위 절반.
stage2:
  pass_top_share: 0.5
  groups:
    시장규모: {weight: 0.35, indicators: {import_market_size: 0.6, hh_consumption_total: 0.4}}
    성장성:   {weight: 0.40, indicators: {import_cagr: 0.4, hh_consumption_pc_cagr: 0.25, population_cagr: 0.2, gdp_growth: 0.15}}
    소비구조: {weight: 0.25, indicators: {youth_share: 0.4, import_pc: 0.4, urbanization_change: 0.2}}

# ------------------------------------------------------------------ 3단계: 승산(우리가 이길 수 있나) = CAGE 거리 + 한국 제품 발판 + 경쟁
# 점수 = 백분위(1단계 통과국 안에서) × 비중. 통과 = 2단계 통과국 중 상위 절반.
stage3:
  pass_top_share: 0.5
  groups:
    한국친화:  {weight: 0.35, cage: 문화, indicators: {kfood_interest: 0.3, kpop_interest: 0.25, learn_korean_interest: 0.15, korea_visitors_pc: 0.3}}
    한국발판:  {weight: 0.35, indicators: {korea_exports_size: 0.4, korea_share: 0.3, korea_exports_change: 0.3}}
    거리제도:  {weight: 0.20, cage: 지리·제도, indicators: {distance_km: 0.5, fta_years: 0.5}}
    경쟁:      {weight: 0.10, cage: 경제, indicators: {japan_share: 1.0}}

# ------------------------------------------------------------------ 4단계: 진입 장벽·비용(들어가면 남나)
# 진출 비용 모듈(kfood_scout/entry_cost, config/entry_cost)을 그대로 쓴다. 매출 목표도 같은 공식(3년 뒤 수입시장 +1%p + 자연 증가분).
# costs.yaml 에 없는 나라는 아래 규칙으로 비용 항목을 채우고 '규칙'으로 표시한다(사람 확인 대상).
stage4:
  pass_if: {npv5_gt: 0, payback_years_le: 3}
  fallback_costs:
    tariff_mfn: 0.10                    # 확인 못한 MFN 관세(비스킷류 개도국 평균대)
    tariff_korea_if_fta: null           # FTA 국가: entry_cost 규칙 min(MFN, 5%)
    route_by_region:                    # KCCI 부산발 항로 지수(costs.yaml 과 같은 값). 없는 지역은 가까운 항로
      East Asia & Pacific: 1684
      South Asia: 1684
      Europe & Central Asia: 3508
      North America: 3508
      Latin America & Caribbean: 3508
      Middle East, North Africa, Afghanistan & Pakistan: 8887
      Sub-Saharan Africa: 8887
    extra_language_if_not_english: true
    registration_per_sku: 0.01
    halal_if_oic: true                  # 이슬람협력기구(OIC) 회원국은 할랄 인증 필요로 본다
    halal_one_time: 0.5
    annual_fixed: 0.05
    annual_fixed_halal_extra: 0.05
    prep_months: 3
    prep_months_halal_extra: 2
    crp: wgi_fit                        # costs.yaml 의 확인된 Damodaran CRP 를 정치안정 지수에 직선으로 맞춰 추정

# ------------------------------------------------------------------ 5단계: 위험 + 충격 시뮬레이션(나빠져도 남나)
stage5:
  risk:                                 # 백분위(1단계 통과국 안에서), 높을수록 안전
    inflation: {weight: 0.25, direction: -1}       # 소비자물가 5년 평균
    fx_volatility: {weight: 0.25, direction: -1}   # 달러 대비 환율 연간 변화율의 10년 표준편차
    governance: {weight: 0.25, direction: 1}       # 법치·부패통제 3년 평균
    logistics: {weight: 0.25, direction: 1}        # 세계은행 물류성과지수(LPI) 최신
  final_weights: {attractiveness: 0.35, ability: 0.35, economics: 0.15, safety: 0.15}
  economics_metric: bc_ratio            # 4단계 편익÷비용(규모 영향 없는 지표). 백분위는 4단계 진입국 안에서
  shocks:                               # 각 충격에서 5년 순이익(npv5)을 다시 계산
    - {id: kwave_fade, name_ko: 한류 둔화, kind: reweight, zero_groups: [한국친화]}
    - {id: recession, name_ko: 경기 침체, kind: revenue, source: worst_import_drop_3y}
    - {id: fx_crash, name_ko: 현지 통화 급락, kind: revenue, source: worst_fx_drop_1y}
    - {id: freight_x2, name_ko: 해상운임 2배, kind: cost_opt, opt: {freight_mult: 2.0}}
    - {id: fta_loss, name_ko: FTA 혜택 상실, kind: cost_opt, opt: {tariff_case: mfn}}
    - {id: risk_x2, name_ko: 국가위험 2배, kind: cost_opt, opt: {crp_mult: 2.0}}
    - {id: compound, name_ko: 복합(침체+통화급락+운임2배), kind: compound, of: [recession, fx_crash, freight_x2]}
  stress_rule:
    exclude_if_negative_in_single_shocks: 2   # 단일 충격 2개 이상에서 순이익 < 0 이면 TOP3 에서 뺌
    conditional_if_negative_in_single_shocks: 1  # 1개면 '조건부'(그 충격 대응이 진출 조건)
  monte_carlo:
    draws: 1000
    seed: 20261103
    dirichlet_concentration: 20          # 비중을 ±약 20% 흔들어(그룹·지표 비중 모두) TOP3 유지 비율을 센다

# ------------------------------------------------------------------ 최종
final:
  n: 3
  order_by: final_score
