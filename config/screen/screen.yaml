    - {k: 유통망, t: "농심 독점 유통사 선정(2026.4), 오뚜기 퓨어골드 10개 점포 전용 매대, 삼양 현지 유통사 운영. 한국 라면 수출 1~8월 34% 증가", src: [{t: "뉴데일리 2026-09-30", u: "https://biz.newdaily.co.kr/site/data/html/2026/09/30/2026093000107.html"}]}
    - {k: 시장, t: "스낵 시장 약 $2.6B, 수입품이 매대의 약 15%", src: [{t: "USDA FAS RP2024-0015", u: "https://www.fas.usda.gov/data/philippines-snack-foods-market-brief"}]}
    - {k: 롯데 거점, t: "롯데GRS가 롯데리아 5년 30개점 계획을 필리핀 통상산업부와 협의", src: [{t: "Manila Bulletin 2025-05-21", u: "https://mb.com.ph/2025/05/21/dti-lotte-group-south-korean-firms-eye-expansion-into-philippines"}]}
    - {k: 진입 절차, t: "식품 등록(CPR)은 온라인 30~45일, 수수료 인상은 유예", src: [{t: "USDA FAS GAIN 2025", u: "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Philippine+Food+and+Drug+Administration%27s+New+Fees+and+Charges+Temporarily+Suspended_Manila_Philippines_RP2025-0026"}]}
