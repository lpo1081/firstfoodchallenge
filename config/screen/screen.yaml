    - {k: 판로, t: "aT가 2026년 5월 쿠알라룸푸르에서 '아세안 K-할랄푸드 페어' 바이어 상담회 개최", src: [{t: "메트로신문 2026-07-05", u: "https://www.metroseoul.co.kr/article/20260705500220"}]}
    - {k: 진입 절차, t: "한국이슬람교중앙회 할랄 인증을 현지 인증기관 JAKIM이 인정 → 한국에서 인증받아 수출 가능", src: [{t: "Korea Muslim Federation", u: "https://en.wikipedia.org/wiki/Korea_Muslim_Federation"}]}
