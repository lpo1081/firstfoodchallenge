# 비즈니스 임팩트(business_impact.json) 가정. 화면 각주에 그대로 보인다.
# 'AI 에이전트가 한 일' 칸 중 엔진 결과 파일에 없는 실행 기록(에이전트 가설 루프 결과, 비용). 1·4번 칸은 결과 파일에서 자동.
agent_flow:
  - who: 2 · AI 가설
    big: AI 가설 9개 → 2개 채택
    p: AI가 "무엇이 한국 과자 수출을 늘리나" 가설 9개를 내고, 필요한 데이터와 계산식까지 설계했습니다.
    items:
      - "채택: 한국과 FTA 발효 기간, 원화 대비 실질환율"
      - "기각 5개: 이주민 비중·재수출 허브·인터넷 보급 등은 과거에 효과가 없었음"
  - who: 3 · 과거로 시험
    big: 7개 구간 중 7번 개선
    p: 가설은 AI 것이든 사람 것이든 같은 시험을 거칩니다. 학습에 쓰지 않은 과거 구간에서 3년 뒤 수출 증가를 더 잘 맞혀야 채택됩니다. 한류 지표는 2015~2021년 7개 구간 모두에서 예측을 개선해 들어갔습니다.
agent_note: "AI 호출 비용은 실행 1회 $0.77(상한 $1)입니다. 품목은 HS 코드 설정 한 줄이라, 같은 에이전트로 빙과·HMR 등 다른 카테고리도 그대로 돌립니다."

impact_note: "2027년, 현지 공장 없이 수출로. 진출해서 3년 안에 과자 수입시장 점유율을 1%p 올리는 목표 매출에, 진출하지 않아도 시장이 커져서 느는 몫을 더한 값. 환율 1,400원/달러, 롯데 몫 29%(제과 3사 해외 매출 중 롯데 비중, 2023)."

