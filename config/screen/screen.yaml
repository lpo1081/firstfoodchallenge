# 결과 화면(outputs/three_criteria/screen.html) 설정. 2026-11-03.
# 화면 숫자는 전부 엔진 결과 파일에서 읽는다. 여기에는 엔진 밖 내용만 둔다.
#  - category_reason: 왜 이 품목인가(화면 맨 위)
#  - gaps: 3대 기준 중 데이터로 못 넣은 것(화면에 그대로 공개)
#  - crosscheck: 모델이 쓰지 않은 외부 자료로 한 교차 확인(출처 링크 필수). 항목·나라는 줄 단위로 추가/삭제.
#  - fallback_decisions: 레드팀 카드(outputs/agent/critic/<ISO3>.json)가 없을 때만 쓰는 판정. 카드가 있으면 무시된다.
category_ko: 건식 과자류
hs_label: HS 1704·1806·1905 (사탕·초콜릿·비스킷·스낵)
category_reason: >-
  롯데웰푸드 매출 1위 카테고리(건과 27.3%)입니다. 또 롯데 상위 5개 카테고리(건과·빙과·유지·HMR·육가공)를 같은 방식으로
  비교했을 때 한류 같은 소비 트렌드를 따라 한국 수출이 움직인 건 과자뿐이었습니다(2026-11-02 비교). 다른 품목은 HS 코드만 바꿔 같은 방식으로 돌립니다.

# 3대 기준 중 데이터로 못 넣은 것. 화면에 그대로 보여 준다(숨기지 않는다).
gaps:
  - {name: 과자 소비 시장 규모, why: "유로모니터(유료)만 있고, 무료인 UNIDO는 필리핀·인도네시아 등이 비어 있음", instead: "과자 수입시장 규모·1인당 수입액으로 대신"}
  - {name: 관세·FTA·환율, why: "가설은 세웠으나 나라×연도 무료 데이터를 확보하지 못함", instead: "레드팀이 기사로 나라별 관세·환율을 확인해 진출 조건에 반영"}
  - {name: 기사 기반 트렌드, why: "과거 15년치를 같은 기준으로 모을 수 없어 점수 검증이 불가", instead: "검색 관심도(구글 트렌드)로 점수에 넣고, 기사는 레드팀 반론에 사용"}

data_sources:
  - {name: UN Comtrade, what: "한국→각국 과자 수출, 각국 과자 수입 (2005–2024)"}
  - {name: 세계은행 WDI·WGI, what: "인구, 소득, 가계소비, 도시화, 인터넷, 정치 안정·법치·부패"}
  - {name: 구글 트렌드, what: "나라별 한국 음식·K-pop·한국어 학습 검색 관심도"}
  - {name: 한국관광공사, what: "국적별 방한 관광객"}

crosscheck:
  rows:
    - {id: recent, name: 2025년 이후 실제 수출, sub: 모델 데이터(2024년까지) 밖 실적}
    - {id: report, name: 현지 시장 보고서, sub: 제3자 시장 분석}
    - {id: peers, name: 한국 경쟁사 유통망, sub: 다른 K-식품이 실제로 깔렸나}
    - {id: lotte, name: 롯데 그룹 현지 기반, sub: 함께 쓸 수 있는 거점}
    - {id: barrier, name: 진입 장벽 해결 경로, sub: 레드팀 조건을 풀 방법이 있나}
  cells:
    PHL:
      recent: {mark: 확인, text: "2026년 상반기 과자류 수출 $12.2M, 전년보다 6.5% 증가", src: [{t: "aT 발표 · 뉴스핌 2026-08-04", u: "https://www.newspim.com/news/view/20260804001094"}]}
      report: {mark: 일부, text: "스낵 시장 약 $2.6B, 수입품이 매대의 약 15%. 무관세 역내 경쟁품이 강함", src: [{t: "USDA FAS RP2024-0015", u: "https://www.fas.usda.gov/data/philippines-snack-foods-market-brief"}]}
      peers: {mark: 확인, text: "농심 독점 유통사 선정(2026.4), 오뚜기 퓨어골드 10개 점포 매대, 삼양 현지 유통사 운영. 라면 수출 1~8월 34% 증가", src: [{t: "뉴데일리 2026-09-30", u: "https://biz.newdaily.co.kr/site/data/html/2026/09/30/2026093000107.html"}]}
      lotte: {mark: 일부, text: "롯데GRS가 롯데리아 5년 30개점 계획, 필리핀 통상산업부와 협의", src: [{t: "Manila Bulletin 2025-05-21", u: "https://mb.com.ph/2025/05/21/dti-lotte-group-south-korean-firms-eye-expansion-into-philippines"}]}
      barrier: {mark: 확인, text: "식품 등록(CPR)은 온라인 30~45일, 수수료 인상은 유예", src: [{t: "USDA FAS GAIN 2025", u: "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Philippine+Food+and+Drug+Administration%27s+New+Fees+and+Charges+Temporarily+Suspended_Manila_Philippines_RP2025-0026"}]}
    MYS:
      recent: {mark: 반대, text: "한국 과자 수출 최근 5년 연 3.2% 증가로 후보 중 낮은 편. 순위는 한류 지표가 끌어올림", src: [{t: "UN Comtrade (엔진 데이터)", u: ""}]}
      report: {mark: 미확인, text: "무료로 볼 수 있는 과자 시장 보고서를 찾지 못함 (유로모니터 유료)"}
      peers: {mark: 미확인, text: "최근 과자·식품 유통망 기사를 찾지 못함"}
      lotte: {mark: 미확인, text: "-"}
      barrier: {mark: 확인, text: "한국이슬람교중앙회 할랄 인증을 현지 JAKIM이 인정", src: [{t: "Korea Muslim Federation", u: "https://en.wikipedia.org/wiki/Korea_Muslim_Federation"}]}
    SGP:
      recent: {mark: 일부, text: "2026년 상반기 농식품 수출 $110.8M, 18.2% 증가. 과자만 따로 나온 수치는 찾지 못함", src: [{t: "메트로신문 2026-08-09", u: "https://www.metroseoul.co.kr/article/20260809500065"}]}
      report: {mark: 미확인, text: "무료로 볼 수 있는 과자 시장 보고서를 찾지 못함"}
      peers: {mark: 일부, text: "FHA 2026 한국관 수출 상담 $59.2M. 바이어가 K-푸드를 프리미엄으로 평가", src: [{t: "강원일보 2026-04-27", u: "https://www.kwnews.co.kr/article/20260427500452"}]}
      lotte: {mark: 미확인, text: "-"}
      barrier: {mark: 확인, text: "껌 외에는 과자 수입 금지 품목 없음, 영양등급 확대 대상에 과자 미포함", src: [{t: "Hexacrunch", u: "https://www.hexacrunch.com.sg/blogs/crunch-journal/nutri-grade-is-coming-to-sauces-and-instant-noodles-in-2027-what-actually-changes"}]}

fallback_decisions:
  PHL: {verdict: 진출, how: 주력 2~3개 품목으로 시작, conditions: ["FTA에서 과자류가 민감품목이라 관세 혜택이 없으니 현지 판매가를 관세 포함으로 다시 잡는다", "품목(SKU)마다 FDA 등록에 30~45일이 걸리니 첫해는 품목 수를 줄인다"]}
  MYS: {verdict: 조건부 진출, how: 할랄 인증 받은 품목만, conditions: ["대형 유통 입점에 할랄 인증이 사실상 필수라 한국이슬람교중앙회 인증(현지 JAKIM 인정)부터 받는다", "한국 과자 수출이 최근 5년 연 3%대로 정체라 기존 수입상 대신 대형 유통 직거래로 들어간다"]}
  SGP: {verdict: 조건부 진출, how: 비스킷·프리미엄 품목 한정, conditions: ["껌은 수입 금지라 빼고 시장 규모를 다시 계산한다", "소매 둔화와 조호르바루 원정 쇼핑이 있어 첫해 물량은 보수적으로 잡는다"]}

