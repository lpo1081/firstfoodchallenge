# 결과 화면(outputs/three_criteria/screen.html) 설정. 2026-11-03.
# 화면 숫자는 전부 엔진 결과 파일에서 읽는다. 여기에는 엔진 밖 내용만 둔다.
#  - category_reason: 왜 이 품목인가(화면 맨 위)
#  - gaps: 3대 기준 중 데이터로 못 넣은 것(화면에 그대로 공개)
#  - crosscheck: 모델이 쓰지 않은 외부 자료로 한 교차 확인(출처 링크 필수). 항목·나라는 줄 단위로 추가/삭제.
#  - fallback_decisions: 레드팀 카드(outputs/agent/critic/<ISO3>.json)가 없을 때만 쓰는 판정. 카드가 있으면 무시된다.
category_ko: 건식 과자류
hs_label: HS 1704·1806·1905 (사탕·초콜릿·비스킷·스낵)
category_reason: >-
  롯데웰푸드 매출 1위 카테고리(건과 27.3%)입니다. 또 롯데 상위 5개 카테고리(건과·빙과·유지·HMR·육가공)를 같은 방식으로
  비교했을 때 한류 같은 소비 트렌드를 따라 한국 수출이 움직인 건 과자뿐이었습니다(2026-11-02 비교). 다른 품목은 HS 코드만 바꿔 같은 방식으로 돌립니다.

# 기준마다 "무엇을 묻는가"와 지표별 설명(화면의 '어떻게 골랐나' 토글). 지표 id 는 config/criteria/three_criteria.yaml 과 같다.
criteria_text:
  성장성: 시장이 크고, 커지고 있나
  트렌드: 소비가 과자·한국 쪽으로 움직이나
  수출입: 한국 과자가 이미 통하고 있나
indicator_notes:
  import_market_size: {q: 1년에 수입하는 과자 규모, src: UN Comtrade}
  import_market_cagr: {q: 수입 과자 시장이 5년간 커진 속도, src: UN Comtrade}
  population_size: {q: 사 먹을 사람이 얼마나 많나, src: 세계은행}
  population_cagr: {q: 인구가 늘고 있나, src: 세계은행}
  hh_consumption_pc_cagr: {q: 1인당 실제 소비가 늘고 있나, src: 세계은행}
  gdp_pc_ppp_cagr: {q: 1인당 소득이 늘고 있나, src: 세계은행}
  kfood_interest: {q: 한국 음식을 얼마나 찾아보나, src: 구글 트렌드}
  kfood_interest_change: {q: 한국 음식 관심이 3년간 늘었나, src: 구글 트렌드}
  kpop_interest: {q: K-pop 관심, src: 구글 트렌드}
  learn_korean_interest: {q: 한국어를 배우려는 관심, src: 구글 트렌드}
  korea_visitors_pc: {q: 인구 대비 한국 여행객, src: 한국관광공사}
  youth_share: {q: 과자 주 소비층(0~14세) 비중, src: 세계은행}
  urbanization_change: {q: 편의점·마트가 늘어나는 도시화 속도, src: 세계은행}
  internet_change: {q: 온라인 유통·SNS가 퍼지는 속도, src: 세계은행}
  import_pc: {q: 1인당 수입 과자 구매액(수입 과자에 익숙한가), src: UN Comtrade}
  import_pc_cagr: {q: 1인당 수입 과자 구매가 늘고 있나, src: UN Comtrade}
  korea_exports_size: {q: 한국 과자가 이미 얼마나 팔리나, src: UN Comtrade}
  korea_exports_cagr: {q: 한국 과자 수출이 5년간 늘어난 속도, src: UN Comtrade}
  korea_exports_change: {q: 최근 3년 한국 과자 수출 증가액, src: UN Comtrade}
  korea_share: {q: 수입 과자 중 한국산 비중, src: UN Comtrade}
  korea_share_change: {q: 한국산 비중이 늘고 있나, src: UN Comtrade}
  net_import_share: {q: 들여와서 실제로 먹는 나라인가(재수출 거점 걸러냄), src: UN Comtrade}
  food_import_dependence: {q: 식품을 수입에 기대는 나라인가, src: 세계은행}
  hh_consumption_total: {q: 사람들이 쓰는 돈의 총량이 얼마나 큰가, src: 세계은행}
  korea_fta_years: {q: 한국 과자 관세가 낮아졌는가, src: 산업통상자원부 FTA 발효일}
  krw_rer_change: {q: 환율 때문에 한국 과자가 싸졌는가, src: 세계은행 환율·물가}

data_sources:
  - {name: UN Comtrade, what: "한국→각국 과자 수출, 각국 과자 수입 (2005–2024)"}
  - {name: 세계은행 WDI·WGI, what: "인구, 소득, 가계소비, 도시화, 인터넷, 정치 안정·법치·부패"}
  - {name: 구글 트렌드, what: "나라별 한국 음식·K-pop·한국어 학습 검색 관심도"}
  - {name: 한국관광공사, what: "국적별 방한 관광객"}

# 숫자 밖 근거: 모델이 쓰지 않은 최근 기사·보고서에서 확인한 사실(출처 링크 필수). 나라별로 줄 단위 추가/삭제.
