<title>K-과자 수출국 스크리닝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 증권사 리서치 노트 + 엑셀 스크리닝 시트. 결론 → 걸러낸 과정 → 비교표 → 국가 1장 → 검증 순서로 위에서 아래로 읽힘 */
:root{
  --paper:#F7F8F9; --sheet:#FFFFFF; --ink:#18212B; --muted:#5E6873; --rule:#D9DEE3;
  --accent:#0D5C73; --accent-ink:#FFFFFF; --heat:13,92,115; --warn:#A6461F; --ok:#2E6B3A;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171C; --sheet:#1A2027; --ink:#E4E8EC; --muted:#99A3AD; --rule:#2E3741;
  --accent:#5FB3CC; --accent-ink:#0E1418; --heat:95,179,204; --warn:#E08A62; --ok:#7FBF8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171C; --sheet:#1A2027; --ink:#E4E8EC; --muted:#99A3AD; --rule:#2E3741;
  --accent:#5FB3CC; --accent-ink:#0E1418; --heat:95,179,204; --warn:#E08A62; --ok:#7FBF8A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.wrap>*{min-width:0} .meta{flex-wrap:wrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mock{font-size:12px;color:var(--muted);border:1px dashed var(--rule);padding:8px 12px;background:var(--sheet)}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .meta{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto}
nav.tabs a{padding:8px 14px;color:var(--muted);text-decoration:none;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
nav.tabs a:hover{color:var(--ink)} nav.tabs a:focus-visible{outline:2px solid var(--accent)}
h2{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 10px;text-transform:uppercase}
.verdict{background:var(--sheet);border:1px solid var(--rule);padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.verdict p.lead{font-size:19px;font-weight:600;margin:0;text-wrap:balance;line-height:1.45}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--rule)}
.pick{padding:14px 16px 4px 0;display:grid;gap:6px;min-width:0}
.pick+.pick{border-left:1px solid var(--rule);padding-left:16px}
.pick .name{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.tag.fill{background:var(--accent);color:var(--accent-ink)}
.tag.grey{border-color:var(--muted);color:var(--muted)}
.prob{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:6px;background:rgba(var(--heat),.14)} .bar i{display:block;height:100%;background:var(--accent)}
.pick p{margin:0;font-size:13px}
.funnel{display:flex;flex-wrap:wrap;gap:0;background:var(--sheet);border:1px solid var(--rule)}
.step{flex:1 1 150px;padding:12px 14px;border-right:1px solid var(--rule);min-width:0}
.step:last-child{border-right:0}
.step b{display:block;font-size:20px} .step span{font-size:12px;color:var(--muted)}
.step.todo b{color:var(--muted)} .step.todo{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(var(--heat),.05) 6px 12px)}
.tablebox{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
tr.sel td{background:rgba(var(--heat),.06)} tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.out td{color:var(--muted)}
td.h{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;width:72px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.sheet2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;background:var(--sheet);border:1px solid var(--rule)}
.sheet2>div{padding:18px 20px;min-width:0}
.sheet2>div+div{border-left:1px solid var(--rule)}
.sheet2 h3{margin:0 0 4px;font-size:18px}
.ind{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 2.6em;gap:4px 10px;align-items:center;font-size:12.5px}
.ind .g{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;letter-spacing:.04em}
.track{position:relative;height:14px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--rule)}
.track::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;border-left:1px dotted var(--muted)}
.track i{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;background:var(--accent);border-radius:50%}
.track i.lo{background:var(--warn)}
.ind .v{font-family:var(--mono);text-align:right;font-size:12px}
.cons{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.cons li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.cons li:last-child{border-bottom:0}
.cons .k{font-size:11px;font-weight:600;color:var(--warn)}
.cons .k.pro{color:var(--ok)}
.cons .src{font-size:11px;color:var(--muted)}
.check{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--sheet);border:1px solid var(--rule)}
.check>div{padding:14px 16px;min-width:0} .check>div+div{border-left:1px solid var(--rule)}
.check b{font-size:20px;display:block} .check span{font-size:12px;color:var(--muted)}
.check p{margin:6px 0 0;font-size:12.5px}
footer{font-size:11.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;display:grid;gap:4px}
@media (max-width:720px){
  .picks,.check{grid-template-columns:1fr}
  .pick+.pick,.check>div+div{border-left:0;border-top:1px solid var(--rule);padding-left:0}
  .check>div+div{padding-left:16px}
  .sheet2{grid-template-columns:1fr} .sheet2>div+div{border-left:0;border-top:1px solid var(--rule)}
}
</style>
<style>
.ans1{font-size:21px;font-weight:700;margin:0;line-height:1.45;text-wrap:balance}
.prio{display:grid;gap:0;border-top:1px solid var(--ink)}
.prow{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:start}
.prow .no{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--accent);line-height:1}
.prow h3{margin:0;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow .why1{margin:4px 0 0;font-size:13.5px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12px} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.kv dd b{font-size:15px}
.prow ol{margin:0;padding-left:18px;font-size:12.5px;display:grid;gap:3px;color:var(--muted)}
.prow .how{font-size:13px;font-weight:600;margin-bottom:4px}
.total{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding-top:12px;font-size:14px}
.total b{font-size:18px;font-variant-numeric:tabular-nums}
.str{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet)}
.str>div{padding:16px 16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:grid;gap:6px;align-content:start;min-width:0}
.str .big{font-size:20px;font-weight:700;line-height:1.25;color:var(--accent);font-variant-numeric:tabular-nums;word-break:keep-all}
.str .t{font-size:14px;font-weight:600}
.str p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.crit{background:var(--sheet);border:1px solid var(--rule)}
.crit details{border-bottom:1px solid var(--rule)} .crit details:last-child{border-bottom:0}
.crit summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;margin:0;color:var(--ink)}
.crit summary::-webkit-details-marker{display:none}
.crit summary .nm{font-size:16px;font-weight:700}
.crit summary .qq{font-size:13px;color:var(--muted);grid-column:1}
.crit summary .wt{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--mono)}
.crit summary .wt b{font-size:20px;display:block;color:var(--accent)} .crit summary .wt span{font-size:11px;color:var(--muted)}
.crit summary::after{content:"지표 보기 ▾";grid-column:1;font-size:12px;color:var(--accent)}
.crit details[open] summary::after{content:"접기 ▴"}
.crit .inner{padding:0 16px 16px}
.crit table{min-width:560px} .crit td{white-space:normal;font-size:13px}
.wbar{display:inline-block;width:80px;height:6px;background:rgba(var(--heat),.14);vertical-align:middle;margin-right:6px}
.wbar i{display:block;height:100%;background:var(--accent)}
.vnote{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.ev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--sheet);border:1px solid var(--rule)}
.ev>div{padding:16px;min-width:0;display:grid;gap:10px;align-content:start} .ev>div+div{border-left:1px solid var(--rule)}
.ev h3{margin:0;font-size:16px}
.ev ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ev li{display:grid;gap:2px;font-size:13px;line-height:1.55}
.ev .kk{font-size:11px;font-weight:600;color:var(--accent)}
.ind2{min-width:640px} .ind2 td{font-size:12.5px} .ind2 td.nm{white-space:normal}
.mini{display:inline-block;width:70px;height:6px;background:rgba(var(--heat),.14);vertical-align:middle;margin-right:6px}
.mini i{display:block;height:100%;background:var(--accent)}
.grp{border-top:1px solid var(--rule);padding-top:14px;margin-top:14px}
.grp:first-of-type{border-top:0;margin-top:0;padding-top:0}
.grp h4{margin:0;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.grp h4 span{font-size:12.5px;font-weight:400;color:var(--muted)}
.notice{font-size:13px;padding:12px 14px;border:1px dashed var(--rule);color:var(--muted)}
.decbox{display:grid;gap:8px;padding:14px 16px;background:rgba(var(--heat),.06);margin-bottom:12px}
.decbox .go{font-size:15px;font-weight:600}
.decbox ol,.decbox ul{margin:0;padding-left:20px;font-size:13.5px;display:grid;gap:4px}
.sev{font-size:11px;font-weight:600;padding:0 6px;border:1px solid currentColor;margin-right:6px;white-space:nowrap}
.sev.m{color:var(--warn)} .sev.l{color:var(--muted)} .sev.h{color:#B3261E}
.links{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.links a{color:var(--accent);text-decoration:none} .links a:hover{text-decoration:underline} .links a,.links span{overflow-wrap:anywhere;min-width:0}
.scroll{max-height:340px;overflow:auto}
details summary{cursor:pointer;font-size:13px;color:var(--accent);margin-top:10px}
td .w{color:var(--warn);font-size:12px}
.fun td{white-space:normal;vertical-align:top;padding:12px 14px}
.fn{width:64px;font-size:20px;font-weight:600;text-align:right}
.ft b{display:block;font-size:14px} .ft span{display:block;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.6}
.fr{width:110px;text-align:right;color:var(--muted);font-size:12px}
h2.qh{text-transform:none;letter-spacing:0;font-size:13px}
.lead2{font-size:15px;font-weight:600;margin:0 0 12px}
@media (max-width:760px){
  .prow{grid-template-columns:36px minmax(0,1fr)} .prow>.c3,.prow>.c4{grid-column:2}
  .ev{grid-template-columns:1fr} .ev>div+div{border-left:0;border-top:1px solid var(--rule)}
  .fr{display:none} .str{grid-template-columns:minmax(0,1fr)}
  .str{grid-template-columns:1fr} .str>div+div{border-left:0;border-top:1px solid var(--rule)}
  .kv{grid-template-columns:auto minmax(0,1fr)}
}
</style>
<div class="wrap">
  <header class="top">
    <h1>K-과자 수출 유망국 스크리닝</h1>
    <div class="meta" id="meta"></div>
  </header>

  <nav class="tabs" aria-label="화면">
    <a href="#verdict" class="on">결론</a><a href="#engine">이 결론이 나온 방법</a><a href="#screen">국가 비교</a><a href="#country">국가 상세</a><a href="#evidence">현장 근거</a>
  </nav>

  <section id="verdict" class="verdict">
    <p class="ans1" id="ans1"></p>
    <div class="prio" id="prio"></div>
    <div class="total" id="total"></div>
  </section>

  <section id="engine">
    <h2 class="qh">이 결론이 나온 방법</h2>
    <p class="lead2" id="eng-lead"></p>
    <div class="str" id="str"></div>
  </section>

  <section id="method">
    <h2 class="qh">세 가지 기준으로 나라를 채점했습니다</h2>
    <p class="lead2" id="crit-lead"></p>
    <div class="crit" id="crit"></div>
    <p class="vnote" id="crit-note"></p>
  </section>

  <section>
    <h2 class="qh">62개국에서 3개국으로</h2>
    <div class="tablebox"><table class="fun"><tbody id="funnel"></tbody></table></div>
  </section>

  <section id="screen">
    <h2 class="qh" id="h-screen"></h2>
    <div class="tablebox">
      <table>
        <thead><tr>
          <th class="r">순위</th><th>국가</th><th class="r">종합</th>
          <th class="r">성장성</th><th class="r">트렌드</th><th class="r">수출입</th>
          <th class="r">한국 과자 수출 2024</th><th>경고</th><th>판정</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note" id="n-screen"></p>
    <details>
      <summary id="s-out"></summary>
      <div class="tablebox scroll" style="margin-top:8px">
        <table>
          <thead><tr><th>국가</th><th>빠진 이유</th><th class="r">종합</th><th class="r">성장성</th><th class="r">트렌드</th><th class="r">수출입</th><th class="r">한국 과자 수출 2024</th></tr></thead>
          <tbody id="outrows"></tbody>
        </table>
      </div>
    </details>
  </section>

  <section id="country">
    <h2 class="qh">국가 상세</h2>
    <div class="verdict" style="gap:6px">
      <h3 id="cname" style="margin:0;font-size:20px"></h3>
      <p class="note" style="margin:0" id="cmeta"></p>
      <div id="cdec" style="margin-top:8px"></div>
      <h3 style="font-size:15px;margin:14px 0 2px">점수가 어떻게 나왔나</h3>
      <p class="note" style="margin:0 0 10px" id="cexpl"></p>
      <div id="cgroups"></div>
      <div id="cred"></div>
    </div>
  </section>

  <section id="evidence">
    <h2 class="qh">숫자 밖에서도 같은 방향인가</h2>
    <p class="lead2">모델이 쓰지 않은 2025~2026년 기사와 보고서에서도 세 나라 모두 한국 식품 판로가 넓어지고 있습니다.</p>
    <div class="ev" id="ev"></div>
  </section>

  <footer id="src"></footer>
</div>
<script>
const D=__DATA__;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc=v=>Math.round(v);
const heat=v=>v==null?"":`background:rgba(var(--heat),${(Math.max(0,v-30)/70*.42).toFixed(2)})`;
const G=["성장성","트렌드","수출입"];
const TOP0=D.cands.slice(0,3), V=D.val, gw=V.gw, B=V.B, M=D.meta;
const links=src=>(src||[]).length?`<div class="links">${src.map(s=>s.u?`<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`:`<span>${esc(s.t)}</span>`).join("")}</div>`:"";
const vtag=iso=>{const k=D.dec[iso];if(!k)return "";return k.verdict=="배제"?`<span class="tag" style="border-color:#B3261E;color:#B3261E">배제</span>`:k.verdict=="진출"?`<span class="tag fill">진출</span>`:`<span class="tag">${esc(k.verdict)}</span>`};
const eok=r=>r[0]==r[1]?r[0]+"억 원":`${r[0]}~${r[1]}억 원`;
const stab=c=>c.hits==null?"–":`${B}번 중 ${c.hits}번`;
const E="앙상블(선택 모델)",S="[기준선] 큰 시장 순",T="[기준선] 직전 3년 증가 순";
const IM=D.impact||{};
const mid=r=>(r[0]+r[1])/2;
const REV=x=>x.entry_target_eok||x.lotte_opportunity_eok;
const RA=(D.robust||{}).recent_actual||{};
const TOP=TOP0.every(c=>IM[c.iso])?TOP0.slice().sort((a,b)=>mid(REV(IM[b.iso]))-mid(REV(IM[a.iso]))||b.score-a.score):TOP0;
const srank=iso=>TOP0.findIndex(c=>c.iso==iso)+1;
const ko=TOP.map(c=>c.ko);
const nG=g=>D.indicators.filter(i=>i.group==g).length;

$("meta").innerHTML=`<span>${esc(M.category)} · ${esc(M.hs)}</span><span>데이터 2005–2024년</span><span>전망 2024→2027</span>`;

// 1. 결론: 진출 우선순위
$("ans1").textContent=`${ko[0]}부터 진출하고, ${ko[1]}·${ko[2]} 순으로 넓힙니다.`;
const revRank=iso=>TOP.findIndex(c=>c.iso==iso)+1;
const lines=TOP.map((c,i)=>{const x=IM[c.iso];const ra=RA[c.iso];const r=[];
 if(x)r.push(`롯데 매출 기회 ${revRank(c.iso)}위(연 ${eok(REV(x))})`);
 if(ra)r.push(`최근 3년 한국 과자 수출 증가 후보 ${ra.n}개국 중 ${ra.rank_in_candidates}위(+$${(ra.increase_usd/1e6).toFixed(1)}M)`);
 r.push(`전망 점수 ${srank(c.iso)}위(${c.score.toFixed(1)}점)`);

function fmt(v,u){if(v==null)return "자료 없음";

 switch(u){case "ln(USD)":return money(Math.exp(v));case "USD":return money(v);
 case "ln(명)":{const p=Math.exp(v);return p>=1e8?(p/1e8).toFixed(1)+"억 명":(p/1e4).toFixed(0)+"만 명"}
 case "%/년":return v.toFixed(1)+"%/년";case "%":return v.toFixed(1)+"%";case "%p/5년":return (v>=0?"+":"")+v.toFixed(1)+"%p";

 case "명/인":return (v*1000).toFixed(1)+"명/인구 1천 명";case "USD/인":return "$"+v.toFixed(2);
 default:return v.toFixed(2)}}
